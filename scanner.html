<nav class="breadcrumb" id="breadcrumb" hx-swap-oob="true">
    <span class="crumb"
          hx-get="/dashboard"
          hx-target="#content"
          hx-swap="innerHTML"
          hx-push-url="/">Dashboard</span>
    <span class="crumb-sep">/</span>
    <span class="crumb active">Scanner</span>
</nav>
<div class="agent-detail">
    <div class="agent-detail-header">
        <div class="agent-detail-title">
            <span class="agent-icon">⊙</span>
            <h2>Scanner</h2>
            <span class="badge badge-running">running</span>
        </div>
    </div>
    <p class="agent-detail-desc">Scans DEX perp funding rates for arbitrage</p>
    
    <p class="agent-tick">last tick: 18:13:40 UTC</p>
    

    <div class="sub-tools">
        <h3 class="section-title">Tools</h3>
        <div class="sub-tools-grid">
            
            <div class="sub-tool-card"
                 hx-get="/scanner/funding"
                 hx-target="#content"
                 hx-swap="innerHTML"
                 hx-push-url="/scanner/funding">
                <span class="sub-tool-icon">◎</span>
                <div class="sub-tool-info">
                    <h4>Funding Rate</h4>
                    <p>DEX perp funding rate arb scanner across 8 exchanges</p>
                </div>
                <span class="sub-tool-arrow">→</span>
            </div>
            
        </div>
    </div>
</div>
