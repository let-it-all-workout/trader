[server]
port = 3000

[telegram]
bot_token = ""  # your Telegram bot token from @BotFather

[telegram.channels]
# Map channel names to Telegram chat IDs
# default = "-1001234567890"
# scanner = "-1009876543210"
# signals = "-1001112223334"

[agents.scanner]
enabled = true
interval_secs = 30
telegram_channel = "scanner"

[agents.executor]
enabled = true
interval_secs = 10

[agents.analytics]
enabled = true
interval_secs = 60
telegram_channel = "analytics"

[agents.signals]
enabled = true
interval_secs = 15
telegram_channel = "signals"

[news]
enabled = true
refresh_secs = 180
extra_keywords = ["dangote", "refinery", "ipo", "bpe", "ngx", "agriculture", "financial sector", "earnings report", "dividend", "qualification date", "closure of register", "top gainer", "stock price spike", "banking", "insurance", "uk exchange", "london stock exchange", "lse", "dual listing", "cross listing", "gdr", "zenith bank", "unicorn", "bitcoin", "ethereum", "defi", "stablecoin", "token", "blockchain", "whale", "funding round", "venture capital", "hyperliquid", "openclaw", "hype", "pump", "trending", "alpha", "sentiment"]
google_queries = [
  "Nigeria tech startup funding unicorn fintech venture capital",
  "Nigeria NGX financial sector earnings report dividend qualification date",
  "NGX top gainers stock spike rally surge Nigeria",
  "Nigeria crypto regulation exchange stablecoin market",
  "Africa startup funding unicorn exits IPO",
  "Zenith Bank UK exchange listing London Stock Exchange dual listing",
  "Nigeria power sector IPO DisCo GenCo privatization",
  "AI chips cloud data center model application market",
  "Nigeria breaking news business markets today",
  "Dangote refinery IPO listing Nigeria",
  "Nigerian Exchange block trade insider dealing",
  "crypto Bitcoin Ethereum DeFi stablecoin market news",
  "cryptocurrency whale flow exchange inflow blockchain",
  "Hyperliquid OpenClaw crypto project hype sentiment",
  "crypto project pump trending viral alpha",
  "global unicorn startup funding valuation IPO",
  "worldwide fintech finance technology innovation",
  "tech startup invention patent funding round"
]

